name: CI

# CRIS-15 — CI baseline. Runs on every PR and on pushes to main.
# No AWS credentials and no deploy in this workflow: the scaffold does not
# provision cloud resources. A deploy job (ampx pipeline-deploy) is added when
# the backend becomes real (CRIS-14).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm


      - name: Debug - list files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -iname "package-lock.json"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # `amplify_outputs.json` is generated by `ampx sandbox`/pipeline deploy and
      # is git-ignored, so it is absent on a fresh CI checkout. This workflow does
      # not deploy a backend (no AWS credentials — see header), so we materialize an
      # empty placeholder purely to satisfy the bundler's static import resolution
      # during `npm run build`. Typecheck is covered separately by an ambient module
      # declaration (see ADR-0012). No-op locally / on real builds where the file exists.
      - name: Placeholder Amplify outputs (no backend deployed in CI)
        run: '[ -f apps/web/amplify_outputs.json ] || echo "{}" > apps/web/amplify_outputs.json'

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
