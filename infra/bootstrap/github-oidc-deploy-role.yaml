AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CRIS — GitHub Actions OIDC identity provider + repo/branch-scoped
  CDK deploy role for `ampx pipeline-deploy` and Amplify Hosting artifact deploys
  (CRIS-14, ADR-0016, ADR-0017, ADR-0059). No long-lived
  AWS keys: GitHub mints a short-lived OIDC token that assumes DeployRole, which
  in turn assumes the CDK bootstrap roles for infrastructure provisioning and
  directly manages the throwaway post-deploy smoke user and the named Amplify
  app's production Hosting branch.
  Deploy this ONCE per AWS account with `scripts/aws/30-deploy-role.sh`.

# ---------------------------------------------------------------------------
# Parameters — safe defaults for this repo; override per environment if needed.
# ---------------------------------------------------------------------------
Parameters:
  GitHubOrg:
    Type: String
    Default: mehmetRodi
    Description: GitHub org/user that owns the repository.

  GitHubRepo:
    Type: String
    Default: CRIS-Crisis-Resolution
    Description: Repository name (without the org prefix).

  GitHubBranch:
    Type: String
    Default: main
    Description: The only Git branch whose OIDC subject may assume the production deploy role.

  CreateOIDCProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Create the token.actions.githubusercontent.com OIDC provider. Set to
      "false" if the account already has one (only one is allowed per account);
      then pass ExistingOIDCProviderArn.

  ExistingOIDCProviderArn:
    Type: String
    Default: ''
    Description: >
      ARN of a pre-existing GitHub OIDC provider. Required only when
      CreateOIDCProvider is "false".

  CdkQualifier:
    Type: String
    Default: hnb659fds
    Description: >
      CDK bootstrap qualifier. `hnb659fds` is the CDK default used by
      `cdk bootstrap` / `ampx`. Change only if you bootstrapped with a custom
      --qualifier.

  AmplifyAppId:
    Type: String
    AllowedPattern: 'd[a-z0-9]+'
    ConstraintDescription: Must be an Amplify app ID such as d123example.
    Description: Existing Amplify Gen 2 app that owns both the backend and production Hosting branch.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOIDCProvider, 'true']

Resources:
  # -------------------------------------------------------------------------
  # GitHub Actions OIDC identity provider (one per account).
  # -------------------------------------------------------------------------
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # IAM no longer validates the thumbprint for well-known IdPs, but the
      # property is still accepted; these are GitHub's published thumbprints.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # -------------------------------------------------------------------------
  # Deploy role — exact repository + branch ref subject only, via OIDC.
  # -------------------------------------------------------------------------
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: crisismap-github-deploy
      Description: >
        Assumed by GitHub Actions only for the configured CRIS repository's
        production branch to deploy and smoke-test CRIS. Provisioning stays
        behind the CDK bootstrap roles; direct access is limited to the throwaway
        Cognito smoke-user lifecycle and artifact deployment to the configured
        Amplify app's production branch.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOIDCProvider
                - !Ref ExistingOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Keep the job free of a GitHub `environment:` key: GitHub
                # otherwise replaces this ref subject with an environment subject,
                # which cannot encode or enforce the branch on all billing plans.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: assume-cdk-bootstrap-roles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CDK / ampx deploys by assuming the file-publishing, image-
              # publishing, lookup, and deploy roles created by `cdk bootstrap`.
              # Those roles hold the real permissions; this role only reaches
              # them. Scoped to this account + the bootstrap qualifier.
              - Sid: AssumeCdkBootstrapRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-deploy-role-${AWS::AccountId}-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-file-publishing-role-${AWS::AccountId}-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-image-publishing-role-${AWS::AccountId}-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-lookup-role-${AWS::AccountId}-*'
              # Pre-flight checks CDK/ampx run before assuming a bootstrap role.
              - Sid: ReadBootstrapVersion
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/cdk-bootstrap/${CdkQualifier}/version'
              # Read-only stack inspection ampx runs directly with THIS role
              # (not via the assumed CDK role): Describe* to poll deploy
              # progress, and GetTemplateSummary to read the deployed stack when
              # generating amplify_outputs.json at the end of pipeline-deploy.
              # All read-only — no provisioning power, consistent with the
              # assume-only design above.
              - Sid: DescribeDeploymentStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              # After CDK provisions the data stack, ampx reads the generated
              # GraphQL schema (model-schema.graphql) it stages in the Amplify
              # codegen S3 bucket, to finish emitting amplify_outputs.json. This
              # is a direct read with THIS role (not the assumed CDK role) and is
              # scoped to Amplify-managed buckets only — read-only, no writes.
              - Sid: ReadAmplifyCodegenArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::amplify-*'
                  - !Sub 'arn:aws:s3:::amplify-*/*'
              # CRIS-35's post-deploy transaction creates one coordinator,
              # signs in through the normal client, then deletes it. These are
              # the only direct provisioning actions the OIDC role needs.
              - Sid: ManageSmokeCoordinator
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminDeleteUser
                Resource:
                  - !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'
              # ADR-0059: the Vite SPA is built from the same checked-out SHA
              # after backend verification, then uploaded as a manual Amplify
              # Hosting deployment. Scope writes to this app and the configured
              # production branch; job reads are scoped below that branch.
              - Sid: ConfigureAmplifyHostingApp
                Effect: Allow
                Action:
                  - amplify:GetApp
                  - amplify:UpdateApp
                Resource:
                  - !Sub 'arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}'
              - Sid: ConfigureAmplifyHostingBranch
                Effect: Allow
                Action:
                  - amplify:GetBranch
                  - amplify:UpdateBranch
                Resource:
                  - !Sub 'arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/branches/${GitHubBranch}'
              # Although CreateDeployment/StartDeployment take app + branch
              # parameters, IAM evaluates them against Amplify's generated
              # deployments child ARN rather than the parent branch ARN.
              - Sid: DeployAmplifyHostingBranch
                Effect: Allow
                Action:
                  - amplify:CreateDeployment
                  - amplify:StartDeployment
                Resource:
                  - !Sub 'arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/branches/${GitHubBranch}/deployments/*'
              - Sid: ReadAmplifyHostingJobs
                Effect: Allow
                Action:
                  - amplify:GetJob
                Resource:
                  - !Sub 'arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/branches/${GitHubBranch}/jobs/*'

Outputs:
  DeployRoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE_ARN GitHub secret.
    Value: !GetAtt DeployRole.Arn
  OIDCProviderArn:
    Description: The GitHub OIDC provider ARN (created or pre-existing).
    Value: !If [ShouldCreateProvider, !Ref GitHubOIDCProvider, !Ref ExistingOIDCProviderArn]
